<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Webhook Messenger</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            discord: {
              blurple: '#5865F2',
              'blurple-hover': '#4752C4',
              green: '#57F287',
              red: '#ED4245',
              darkest: '#1e1f22',
              card: '#2b2d31',
              input: '#1e1f22',
              hover: '#35373c',
              text: '#dbdee1',
              muted: '#949ba4',
              heading: '#f2f3f5'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-discord-darkest text-discord-text min-h-screen flex flex-col items-center justify-center p-4 selection:bg-discord-blurple selection:text-white font-sans antialiased">

  <!-- MAIN CARD CONTAINER -->
  <div class="w-full max-w-lg bg-discord-card border border-white/10 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
    
    <!-- HEADER -->
    <div class="flex items-center space-x-3.5 border-b border-white/5 pb-5">
      <div class="w-12 h-12 rounded-2xl bg-discord-blurple text-white flex items-center justify-center text-2xl shadow-lg shadow-discord-blurple/30 flex-shrink-0">
        <i class="fa-brands fa-discord"></i>
      </div>
      <div class="min-w-0 flex-1">
        <h1 class="text-xl font-bold text-discord-heading tracking-tight">Discord Messenger</h1>
        <p class="text-xs text-discord-muted truncate">Send direct messages to your Discord channel</p>
      </div>
    </div>

    <!-- NOTIFICATION / STATUS BANNER -->
    <div id="statusAlert" class="hidden p-3.5 rounded-xl text-xs font-medium flex items-center gap-2.5 transition duration-200">
      <i id="statusIcon" class="fa-solid fa-circle-check text-base"></i>
      <span id="statusMessage" class="flex-1 break-words"></span>
      <button onclick="dismissStatus()" class="text-white/60 hover:text-white transition">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- FORM -->
    <form id="messageForm" onsubmit="handleSendMessage(event)" class="space-y-4">
      
      <!-- MESSAGE INPUT -->
      <div>
        <label for="messageContent" class="block text-xs font-semibold uppercase tracking-wider text-discord-heading mb-1.5 flex items-center justify-between">
          <span>Message <span class="text-discord-red">*</span></span>
          <span class="text-[11px] font-normal text-discord-muted">Markdown enabled</span>
        </label>
        <textarea 
          id="messageContent" 
          rows="5" 
          required 
          autofocus
          placeholder="Type your message here... (e.g. Hello world! You can use **bold**, *italics*, and @everyone)"
          class="w-full bg-discord-input text-discord-heading border border-white/10 rounded-xl p-3.5 text-sm focus:outline-none focus:border-discord-blurple focus:ring-1 focus:ring-discord-blurple transition placeholder-discord-muted/60 leading-relaxed resize-y"
          onkeydown="handleTextareaKeydown(event)"
          oninput="updateCharCount()"
        ></textarea>
        <div class="flex items-center justify-between text-[11px] text-discord-muted mt-1 px-1">
          <span>Tip: Press <kbd class="px-1.5 py-0.5 rounded bg-discord-input border border-white/10 text-discord-text text-[10px] font-mono">Ctrl</kbd> + <kbd class="px-1.5 py-0.5 rounded bg-discord-input border border-white/10 text-discord-text text-[10px] font-mono">Enter</kbd> to send</span>
          <span id="charCount">0 characters</span>
        </div>
      </div>

      <!-- BOT USERNAME (OPTIONAL) -->
      <div>
        <label for="customUsername" class="block text-xs font-semibold text-discord-heading mb-1.5">
          Sender Name <span class="text-discord-muted font-normal text-[11px]">(Optional)</span>
        </label>
        <input 
          type="text" 
          id="customUsername" 
          placeholder="Defaults to Webhook Name" 
          class="w-full bg-discord-input text-discord-heading border border-white/10 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-discord-blurple focus:ring-1 focus:ring-discord-blurple transition placeholder-discord-muted/60"
        >
      </div>

      <!-- COLLAPSIBLE WEBHOOK URL FIELD -->
      <div class="pt-1">
        <details class="group bg-discord-input/60 border border-white/5 rounded-xl overflow-hidden text-xs">
          <summary class="cursor-pointer px-3.5 py-2.5 text-discord-muted hover:text-discord-heading flex items-center justify-between font-medium select-none transition">
            <span class="flex items-center gap-2">
              <i class="fa-solid fa-link text-discord-blurple text-[11px]"></i>
              <span>Webhook Endpoint Config</span>
            </span>
            <i class="fa-solid fa-chevron-down text-[10px] transition group-open:rotate-180"></i>
          </summary>
          <div class="p-3 border-t border-white/5 space-y-2">
            <div class="relative flex items-center">
              <input 
                type="password" 
                id="webhookUrl" 
                value="https://discord.com/api/webhooks/1563266951516524604/JQZDxzNfvsOT6OsU1fTM1JkjMRHeuZJGrGRdhQjMbiZOS8XtlSXmSc-hM8fpXoxI0Qwu"
                class="w-full bg-discord-card text-discord-text font-mono text-[11px] border border-white/10 rounded-lg px-3 py-2 pr-16 focus:outline-none focus:border-discord-blurple"
              >
              <button 
                type="button" 
                onclick="toggleWebhookVisibility()" 
                class="absolute right-2 px-2 py-1 text-discord-muted hover:text-discord-heading transition text-xs" 
                title="Toggle visibility"
              >
                <i id="toggleEyeIcon" class="fa-solid fa-eye"></i>
              </button>
            </div>
            <p class="text-[11px] text-discord-muted">Pre-filled with your Discord webhook URL. Change anytime if needed.</p>
          </div>
        </details>
      </div>

      <!-- SEND BUTTON -->
      <div class="pt-2">
        <button 
          type="submit" 
          id="sendButton" 
          class="w-full py-3.5 px-6 rounded-xl bg-discord-blurple hover:bg-discord-blurple-hover active:scale-[0.99] text-white font-semibold text-sm shadow-lg shadow-discord-blurple/25 flex items-center justify-center gap-2 transition disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
        >
          <i id="btnIcon" class="fa-solid fa-paper-plane text-xs"></i>
          <span id="btnText">Send Message</span>
        </button>
      </div>

    </form>

  </div>

  <!-- SCRIPT -->
  <script>
    // Character counter
    function updateCharCount() {
      const text = document.getElementById('messageContent').value;
      document.getElementById('charCount').innerText = `${text.length} characters`;
    }

    // Ctrl + Enter or Cmd + Enter shortcut
    function handleTextareaKeydown(event) {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
        event.preventDefault();
        document.getElementById('messageForm').requestSubmit();
      }
    }

    // Toggle Webhook password visibility
    function toggleWebhookVisibility() {
      const input = document.getElementById('webhookUrl');
      const icon = document.getElementById('toggleEyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // Show alert banner
    function showAlert(message, type) {
      const alert = document.getElementById('statusAlert');
      const icon = document.getElementById('statusIcon');
      const msg = document.getElementById('statusMessage');

      alert.classList.remove('hidden', 'bg-emerald-500/15', 'text-emerald-400', 'border-emerald-500/30', 'bg-red-500/15', 'text-red-400', 'border-red-500/30', 'border');

      if (type === 'success') {
        alert.classList.add('bg-emerald-500/15', 'text-emerald-400', 'border', 'border-emerald-500/30');
        icon.className = 'fa-solid fa-circle-check text-base text-emerald-400';
      } else {
        alert.classList.add('bg-red-500/15', 'text-red-400', 'border', 'border-red-500/30');
        icon.className = 'fa-solid fa-triangle-exclamation text-base text-red-400';
      }

      msg.innerText = message;
      alert.classList.remove('hidden');
    }

    function dismissStatus() {
      document.getElementById('statusAlert').classList.add('hidden');
    }

    // Audio chime using Web Audio API
    function playBeep(isSuccess) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (isSuccess) {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.setValueAtTime(880, now + 0.08); // A5
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {
        // Audio context wasn't allowed or is unsupported
      }
    }

    // Send payload to Discord API
    async function handleSendMessage(event) {
      event.preventDefault();

      const webhookUrl = document.getElementById('webhookUrl').value.trim();
      const messageContent = document.getElementById('messageContent').value.trim();
      const customUsername = document.getElementById('customUsername').value.trim();

      if (!webhookUrl || !webhookUrl.startsWith('http')) {
        showAlert('Please enter a valid Discord webhook URL.', 'error');
        return;
      }

      if (!messageContent) {
        showAlert('Please enter a message to send.', 'error');
        return;
      }

      const btn = document.getElementById('sendButton');
      const btnIcon = document.getElementById('btnIcon');
      const btnText = document.getElementById('btnText');
      const textarea = document.getElementById('messageContent');

      // Loading state
      btn.disabled = true;
      btnIcon.className = 'fa-solid fa-spinner animate-spin text-xs';
      btnText.innerText = 'Sending...';
      dismissStatus();

      // Build Discord payload
      const payload = {
        content: messageContent
      };
      if (customUsername) {
        payload.username = customUsername;
      }

      try {
        const response = await fetch(webhookUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        // Discord returns 204 No Content on successful message creation
        if (response.status === 204 || response.ok) {
          showAlert('Message successfully delivered to your Discord channel!', 'success');
          playBeep(true);
          textarea.value = '';
          updateCharCount();
          textarea.focus();
        } else if (response.status === 429) {
          const data = await response.json().catch(() => ({}));
          const retry = Math.ceil(data.retry_after || 5);
          showAlert(`Discord rate limit hit! Please wait ${retry} seconds before retrying.`, 'error');
          playBeep(false);
        } else if (response.status === 404) {
          showAlert('Discord returned 404 Not Found. This webhook might have been deleted.', 'error');
          playBeep(false);
        } else {
          showAlert(`Discord returned HTTP error code ${response.status}.`, 'error');
          playBeep(false);
        }
      } catch (err) {
        showAlert(`Network error: ${err.message}. Check your internet connection or webhook URL.`, 'error');
        playBeep(false);
      } finally {
        btn.disabled = false;
        btnIcon.className = 'fa-solid fa-paper-plane text-xs';
        btnText.innerText = 'Send Message';
      }
    }
  </script>

</body>
</html>
